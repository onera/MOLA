# MOLA CI/CD Configuration
# This file defines the pipeline for automated testing and deployment

# Global variables
variables:
  MOLA_ENV_DEFAULT: src/mola/env/onera/env.sh
  MOLA_ENV_ELSA: src/mola/env/onera/env.sh elsa
  MOLA_ENV_FAST: src/mola/env/onera/env.sh fast
  MOLA_ENV_SONICS: src/mola/env/onera/env.sh sonics
  SCHEDULER_PARAMETERS: "--ntasks=1 --time=00:30:00"  # Slurm default parameters
  PYTEST_ADDOPTS: "-vv --durations=20 -k 'not sator'"  # default options for pytest

# Default job configuration
default:
  tags:
    - juno-slurm
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.onera.net

# Pipeline stages
stages:
  - test-unit
  - test-integration
  - release-candidate
  - examples-submit
  - examples-monitor
  - examples-validate
  - examples-repatriate
  - examples-postprocess
  - examples-publish
  - code-quality
  - doc
  - final_release

.no_tests_on_tags:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

test_unit_elsa:
  extends: .no_tests_on_tags
  stage: test-unit 
  variables:
    SCHEDULER_PARAMETERS: "--ntasks=2 --time=00:30:00"
  before_script:
    - source $MOLA_ENV_ELSA
    - export OMP_NUM_THREADS=2
  script:
    - coverage run --data-file=.coverage_test_unit_elsa -m pytest -m unit 
  artifacts:
    paths:
      - .coverage_test_unit_elsa
    expire_in: 1 day
  
test_integration_elsa:
  extends: .no_tests_on_tags  
  stage: test-integration
  needs: ["test_unit_elsa"]
  variables:
    SCHEDULER_PARAMETERS: "--ntasks=4 --time=00:30:00"
  before_script:
    - source $MOLA_ENV_ELSA
    - export OMP_NUM_THREADS=4
  script:
    - coverage run --data-file=.coverage_test_integration_elsa -m pytest -m integration
  artifacts:
    paths:
      - .coverage_test_integration_elsa
    expire_in: 1 day

test_unit_fast:
  extends: .no_tests_on_tags
  stage: test-unit 
  variables:
    SCHEDULER_PARAMETERS: "--ntasks=2 --time=00:30:00"
  before_script:
    - source $MOLA_ENV_FAST
    - export OMP_NUM_THREADS=2
  script:
    - coverage run --data-file=.coverage_test_unit_fast -m pytest -m unit 
  artifacts:
    paths:
      - .coverage_test_unit_fast
    expire_in: 1 day
  
test_integration_fast:
  extends: .no_tests_on_tags 
  stage: test-integration
  needs: ["test_unit_fast"]
  variables:
    SCHEDULER_PARAMETERS: "--ntasks=4 --time=00:30:00"
  before_script:
    - source $MOLA_ENV_FAST
    - export OMP_NUM_THREADS=4
  script:
    - coverage run --data-file=.coverage_test_integration_fast -m pytest -m integration
  artifacts:
    paths:
      - .coverage_test_integration_fast
    expire_in: 1 day

test_unit_sonics:
  extends: .no_tests_on_tags 
  stage: test-unit
  variables:
    SCHEDULER_PARAMETERS: "--time=00:30:00 --ntasks=2"
  before_script:
    - source $MOLA_ENV_SONICS
    - unset PYTEST_PLUGINS
    - export OMP_NUM_THREADS=2
  script:
    - coverage run --data-file=.coverage_test_unit_sonics -m pytest -m unit
  artifacts:
    paths:
      - .coverage_test_unit_sonics
    expire_in: 1 day

test_integration_sonics:
  extends: .no_tests_on_tags  
  stage: test-integration
  needs: ["test_unit_sonics"]
  variables:
    SCHEDULER_PARAMETERS: "--time=01:00:00 --ntasks=4"
  before_script:
    - source $MOLA_ENV_SONICS
    - export OMP_NUM_THREADS=4
    - unset PYTEST_PLUGINS
  script:
    - coverage run --data-file=.coverage_test_integration_sonics -m pytest -m integration
  artifacts:
    paths:
      - .coverage_test_integration_sonics
    expire_in: 1 day


release_candidate_prepare:
  stage: release-candidate
  tags:
    - juno-shell  # Use login node for SSH-based deployment
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+(-.*)?$/  # Match release candidate tags
  variables:
    RELEASE_VERSION: $CI_COMMIT_TAG
    DEPLOY_TARGET: "/stck/mola/${CI_COMMIT_TAG}"
  script:
    - echo "Starting Release Candidate ${RELEASE_VERSION}"
    - chmod +x scripts/cicd/deploy.sh
    - scripts/cicd/deploy.sh ${CI_PROJECT_DIR} ${RELEASE_VERSION}
  artifacts:
    paths:
      - .release/
    expire_in: 1 week
  allow_failure: false


examples_submit:
  stage: examples-submit
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+$/
  needs:
    - release_candidate_prepare
  script:
    - source /stck/mola/${CI_COMMIT_TAG}/env_mola.sh
    - export OMP_NUM_THREADS=1
    - echo "Submitting examples..."
    - python3 -m mola.cicd.examples_runner submit
    - echo ""
    - echo "Examples submission complete!"
examples_monitor:
  stage: examples-monitor
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+$/
  needs:
    - job: examples_submit
  script:
    - source $MOLA_ENV_ELSA
    - export OMP_NUM_THREADS=1
    - echo "Monitoring example results..."
    - echo ""
    - python3 -m mola.cicd.examples_runner validate
    - code=$?
    - echo "VALIDATION_STATUS=$code" > validate.env
  artifacts:
    when: always
    reports:
      dotenv: validate.env
  allow_failure: true


examples_validate:
  stage: examples-validate
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+$/
  needs:
    - job: examples_monitor
      artifacts: true
  script:
    - |
      if [ "$VALIDATION_STATUS" = "1" ]; then
        echo "Examples failed. Failing pipeline."
        exit 1
      fi
      echo "Validation status: $VALIDATION_STATUS (not failing)."
      exit 0
  artifacts:
    reports:
      dotenv: validate.env


examples_repatriate:
  stage: examples-repatriate
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+$/'
  needs:
    - job: examples_validate
    - job: examples_monitor
  tags:
    - juno-shell
  script:
    - source $MOLA_ENV_DEFAULT
    - export OMP_NUM_THREADS=1
    - chmod +x scripts/cicd/repatriate.sh
    - scripts/cicd/repatriate.sh ${CI_PROJECT_DIR} "$CI_COMMIT_TAG" full "$USER"
examples_postprocess:
  stage: examples-postprocess
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+$/'
  needs:
    - job: examples_repatriate
  tags:
    - juno-shell
  script:
    - source /stck/mola/${CI_COMMIT_TAG}/env_mola.sh
    - export OMP_NUM_THREADS=2
    - chmod +x scripts/cicd/repatriate.sh
    - scripts/cicd/repatriate.sh ${CI_PROJECT_DIR} "$CI_COMMIT_TAG" postprocess "$USER"
examples_publish:
  stage: examples-publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\d+$/'
  needs:
    - job: examples_postprocess
  tags:
    - juno-shell
  script:
    - source $MOLA_ENV_DEFAULT
    - export OMP_NUM_THREADS=1
    - chmod +x scripts/cicd/repatriate.sh
    - scripts/cicd/repatriate.sh ${CI_PROJECT_DIR} "$CI_COMMIT_TAG" light "$USER"


final_release:
  stage: final_release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  tags:
    - juno-shell
  script:
    - echo "Promoting the validated release candidate."
    - chmod +x scripts/cicd/promote_release.sh scripts/cicd/promote_release_as_mola.sh
    - scripts/cicd/promote_release.sh "$CI_COMMIT_TAG" "${RELEASE_CANDIDATE_TAG:-}"
    - source "$MOLA_ENV_DEFAULT"
    - MOLA_DOC_VERSION="$CI_COMMIT_TAG" make -C doc install_doc_requirements
    - MOLA_DOC_VERSION="$CI_COMMIT_TAG" make -C doc doc
    - python3 scripts/cicd/update_doc_versions.py doc/html/_static/versions.json "$CI_COMMIT_TAG"
    - chmod +x scripts/cicd/deploy_doc.sh
    - scripts/cicd/deploy_doc.sh doc/html "$CI_COMMIT_TAG"
#    - chmod +x scripts/sync_to_github.sh
#    - scripts/sync_to_github.sh "$CI_COMMIT_TAG"


coverage_report:
  extends: .no_tests_on_tags
  stage: code-quality
  dependencies:
    - test_unit_elsa
    - test_unit_sonics
    - test_unit_fast
    - test_integration_elsa
    - test_integration_sonics
    - test_integration_fast
  before_script:
    - source $MOLA_ENV_DEFAULT
  allow_failure: true  # if job fails (in script section), it will just raise a warning
  script:
    - coverage combine .coverage_test_unit_elsa .coverage_test_unit_sonics .coverage_test_integration_elsa .coverage_test_unit_fast .coverage_test_integration_fast .coverage_test_integration_sonics
    - coverage report
    - coverage xml  # generate the report coverage.xml (the name can be changed with option -o)
    - coverage html # generate the report in directory htmlcov (the name can be changed with option -d)
    - tar -czf htmlcov.tar.gz htmlcov
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - reports/*
      - htmlcov.tar.gz
    reports:
      junit: reports/*_test.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


radon_complexity:
  extends: .no_tests_on_tags
  stage: code-quality
  before_script:
    - source $MOLA_ENV_DEFAULT
    - pip install radon
  allow_failure: true  # if job fails (in script section), it will just raise a warning
  script:
    - radon cc --min D --ignore "mesh,pytree,lifting_line,tool_interface" src > radon_cc_report.txt  
    - radon mi --min B --ignore "mesh,pytree" src > radon_mi_report.txt
    - export COMPLEXITY_WARNING=false
    - |
        if [ -s radon_cc_report.txt ]; then 
          echo "WARNING: Code cyclomatic complexity is too high. Please simplify the following functions:" && \
          cat radon_cc_report.txt && \
          export COMPLEXITY_WARNING=true; 
        fi
    - |
        if [ -s radon_mi_report.txt ]; then 
          echo "WARNING: Code maintenability index is too high. Please simplify the following files:" && \
          cat radon_mi_report.txt && \
          export COMPLEXITY_WARNING=true; 
        fi
    - if $COMPLEXITY_WARNING; then false; fi

compile_doc:
  stage: doc
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # only for a commit on the default branch
  before_script:
    - source $MOLA_ENV_ELSA
  script: 
    - cd doc
    - make install_doc_requirements
    - make doc
  artifacts:   
    paths:
      - doc/html
    expire_in: 1 hour

pages:    # Name to use for doc deployment
  stage: doc
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # only for a commit on the default branch
  needs: ["compile_doc"]
  dependencies:
    - compile_doc
  before_script:
    - source $MOLA_ENV_DEFAULT
    - MOLA_VERSION=$(python3 -c "import mola; print(mola.__version__)")
    - DOC_DIR_NAME=Dev
  script: # doc directory has to be moved to the working directory and be renamed "public" 
    # copy existing doc for previous versions
    - rsync -avL --exclude="$DOC_DIR_NAME" /stck/mola/html/ public
    # copy doc of current version in public directory
    - cp -rL doc/html public/$DOC_DIR_NAME
  artifacts:   # Mandatory block to deploy documentation
    paths:
      - public
    expire_in: 30 seconds
