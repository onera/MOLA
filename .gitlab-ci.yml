# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master-v2" 
    - when: always

variables:
  MOLA_ENV_ELSA: src/mola/env/onera/env.sh elsa 
  MOLA_ENV_SONICS: src/mola/env/onera/env.sh sonics 

default:
  tags: 
    - shell
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.onera.net

stages:
  - test
  - deploy

test_unit_elsa: 
  stage: test
  before_script:
    - source $MOLA_ENV_ELSA
  script:
    - coverage run -m pytest -m unit 
  artifacts:
    paths:
      - .coverage
    expire_in: 1 hour
  
test_unit_sonics: 
  stage: test
  tags: 
    - juno-shell 
  before_script:
    - source $MOLA_ENV_SONICS
  script:
    - coverage run -m pytest -m unit 
  artifacts:
    paths:
      - .coverage
    expire_in: 1 hour

# test_integration_elsa:   # does not work because it requires to handle job submission
#   stage: test
#   needs: ["test_unit_elsa"]
#   before_script:
#     - source $MOLA_ENV_ELSA
#   script:
#     - coverage run -m pytest -m integration 
#   artifacts:
#     paths:
#       - .coverage
#     expire_in: 1 hour

coverage_report:
  stage: deploy
  dependencies:
    - test_unit_elsa
    - test_unit_sonics
  script:
    - coverage combine test_unit_elsa/.coverage test_unit_sonics/.coverage
    - coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 hour

pages:    # Nom à utiliser
  stage: deploy
  rules:   # Bloc  facultatif : ça permet de déployer la doc que si on a pushé sur la branche master
    - if: $CI_COMMIT_BRANCH == "master" # $CI_DEFAULT_BRANCH when master-v2 becomes the default branch
  script:   # Le dossier html qui défini le site web doit se trouver à la racine du working directory et s'appeller public. Ici, on l'a déjà généré avant donc on a juste à copier
    - cp -r /stck/lbernard/MOLA/Dev/DOCUMENTATION/html public 
  artifacts:   # Bloc obligatoire
    paths:
      - public

