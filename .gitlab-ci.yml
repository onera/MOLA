# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master-v2" 
    - when: always

variables:
  MOLA_ENV_DEFAULT: src/mola/env/onera/env.sh
  MOLA_ENV_ELSA: src/mola/env/onera/env.sh elsa 
  MOLA_ENV_SONICS: src/mola/env/onera/env.sh sonics 
  SCHEDULER_PARAMETERS: "--ntasks=1 --time=00:30:00"  #Slurm default parameters

default:
  tags: 
    - juno-slurm
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.onera.net

stages:
  - test
  - code-quality
  - deploy


test_unit_elsa: 
  stage: test 
  before_script:
    - source $MOLA_ENV_ELSA
  script:
    - coverage run --data-file=.coverage_test_unit_elsa -m pytest -m unit 
  artifacts:
    paths:
      - .coverage_test_unit_elsa
    expire_in: 1 day
  
test_integration_elsa:  
  stage: test
  needs: ["test_unit_elsa"]
  tags: 
    - slurm
  variables:
    SCHEDULER_PARAMETERS: "--qos=co_short_std  --ntasks=4 --time=00:30:00"
  before_script:
    - source $MOLA_ENV_ELSA
  script:
    - coverage run --data-file=.coverage_test_integration_elsa -m pytest -m integration -k "not test_WorkflowParallelScheduler_sphere_ and not _remote_sator"
  artifacts:
    paths:
      - .coverage_test_integration_elsa
    expire_in: 1 day

test_unit_sonics: 
  stage: test 
  tags: 
    - juno-shell
  before_script:
    - source $MOLA_ENV_SONICS
  script:
    - coverage run --data-file=.coverage_test_unit_sonics -m pytest -m unit 
  artifacts:
    paths:
      - .coverage_test_unit_sonics
    expire_in: 1 day

coverage_report:  # Miss integration tests for now
  stage: code-quality
  dependencies:
    - test_unit_elsa
    - test_unit_sonics
    # - test_integration_elsa
  before_script:
    - source $MOLA_ENV_DEFAULT
  script:
    - coverage combine .coverage_test_unit_elsa .coverage_test_unit_sonics # .coverage_test_integration_elsa
    - coverage xml  # generate the report coverage.xml (the name can be changed with option -o)
    - coverage html # generate the report in directory htmlcov (the name can be changed with option -d)
    # - tar -czf htmlcov.tar.gz htmlcov
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov

radon_complexity:
  stage: code-quality
  before_script:
    - source $MOLA_ENV_DEFAULT
    - pip install radon
  script:
    - radon cc --min D src > radon_cc_complexity_report_min_D.txt  
    - radon mi --min B src > radon_mi_complexity_report_min_B.txt
  artifacts:
    paths:
      - radon_cc_complexity_report_min_D.txt
      - radon_mi_complexity_report_min_B.txt
  # after_script:  # to stop the pipeline if code quality is too bad
  #   - if [ -s radon_cc_complexity_report_min_D.txt ]; then false; fi
  #   - if [ -s radon_mi_complexity_report_min_B.txt ]; then false; fi

pages:    # Nom à utiliser
  stage: deploy
  tags: 
    - juno-shell
  rules:   # Bloc  facultatif : ça permet de déployer la doc que si on a pushé sur la branche master
    - if: $CI_COMMIT_BRANCH == "master" # $CI_DEFAULT_BRANCH when master-v2 becomes the default branch
  script:   # Le dossier html qui défini le site web doit se trouver à la racine du working directory et s'appeller public. Ici, on l'a déjà généré avant donc on a juste à copier
    - cp -r /stck/lbernard/MOLA/Dev/DOCUMENTATION/html public 
  artifacts:   # Bloc obligatoire
    paths:
      - public

